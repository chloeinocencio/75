name: SeventyFive
options:
  bundleIdPrefix: com.chloeinocencio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  SeventyFive:
    type: application
    platform: iOS
    sources:
      - path: SeventyFive
    info:
      path: SeventyFive/Info.plist
      properties:
        CFBundleDisplayName: "75"
        UILaunchScreen: {}
        NSCameraUsageDescription: "75 uses your camera to take your progress photos."
        NSPhotoLibraryUsageDescription: "Save your progress photos to your library."
        NSPhotoLibraryAddUsageDescription: "Save your progress photos to your library."
        NSContactsUsageDescription: "Match your phone contacts to find friends already using 75."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chloeinocencio.seventyfive
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: true
