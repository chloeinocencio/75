name: 75SoftTracker
options:
  bundleIdPrefix: com.chloeinocencio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  75SoftTracker:
    type: application
    platform: iOS
    sources:
      - path: 75SoftTracker
    info:
      path: 75SoftTracker/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "75 Soft uses your camera to take your daily progress photo."
        NSPhotoLibraryUsageDescription: "Save your progress photos to your library."
        NSPhotoLibraryAddUsageDescription: "Save your progress photos to your library."
        NSContactsUsageDescription: "Match your phone contacts to find friends already using 75 Soft."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chloeinocencio.75softtracker
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: true
    capabilities:
      - com.apple.developer.background-modes
